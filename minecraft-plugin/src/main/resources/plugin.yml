name: DeployraBridge
version: 1.2.0
main: io.deployra.minecraft.DeployraPlugin
description: Manage this Minecraft server from the Deployra panel (outbound connection, no open ports).
author: Deployra
website: https://github.com/PanS4ge/deployra
api-version: 1.13
softdepend: [PlaceholderAPI]
commands:
  deployra:
    description: Pair with the Deployra panel or show the connection status
    permission: deployra.admin
    usage: /deployra [status|pair <panel-url> <code>|unpair]
permissions:
  deployra.admin:
    description: Allows pairing the server with Deployra
    default: op
