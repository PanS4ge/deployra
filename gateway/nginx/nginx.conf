# Deployra-WG — główna konfiguracja nginx (bramka kopiuje ją do wolumenu, nginx czyta przez dowiązanie).
# Hosty, streamy i listy dostępu generuje bramka do /etc/nginx/deployra/.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    server_names_hash_bucket_size 128;
    client_max_body_size 100m;

    # Statystyki odwiedzin: każde żądanie trafia przez syslog/UDP do procesu Deployra-WG
    # (bez pliku logu i zapisu na dysk). Gdy bramka nie słucha, pakiety po prostu giną.
    log_format deployra_json escape=json
        '{"h":"$host","a":"$remote_addr","u":"$http_user_agent","s":$status,"m":"$request_method","b":$body_bytes_sent,"t":$msec,"r":"$uri"}';
    access_log syslog:server=127.0.0.1:5140,tag=deployra,nohostname deployra_json;

    # Ruch z cloudflared przychodzi z localhosta — prawdziwy adres klienta jest w CF-Connecting-IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $deployra_xfp {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    proxy_cache_path /var/cache/nginx/deployra levels=1:2 keys_zone=deployra_cache:10m max_size=256m inactive=60m use_temp_path=off;

    include /etc/nginx/deployra/http/*.conf;
}

stream {
    include /etc/nginx/deployra/stream/*.conf;
}
