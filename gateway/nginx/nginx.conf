# Deployra-WG — główna konfiguracja nginx (montowana do oficjalnego obrazu, tylko do odczytu).
# Hosty, streamy i listy dostępu generuje bramka do /etc/nginx/deployra/.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    server_names_hash_bucket_size 128;
    client_max_body_size 100m;

    log_format deployra '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log deployra;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $deployra_xfp {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    proxy_cache_path /var/cache/nginx/deployra levels=1:2 keys_zone=deployra_cache:10m max_size=256m inactive=60m use_temp_path=off;

    include /etc/nginx/deployra/http/*.conf;
}

stream {
    include /etc/nginx/deployra/stream/*.conf;
}
