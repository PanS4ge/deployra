# Deployra-WG — główna konfiguracja nginx (bramka kopiuje ją do wolumenu, nginx czyta przez dowiązanie).
# Hosty, streamy i listy dostępu generuje bramka do /etc/nginx/deployra/.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    server_names_hash_bucket_size 128;
    client_max_body_size 100m;

    # Statystyki odwiedzin: każde żądanie trafia przez syslog/UDP do procesu Deployra-WG
    # (bez pliku logu i zapisu na dysk). Gdy bramka nie słucha, pakiety po prostu giną.
    log_format deployra_json escape=json
        '{"h":"$host","a":"$remote_addr","u":"$http_user_agent","s":$status,"m":"$request_method","b":$body_bytes_sent,"t":$msec,"r":"$request_uri"}';
    access_log syslog:server=127.0.0.1:5140,tag=deployra,nohostname deployra_json;

    # Prawdziwy adres klienta: Cloudflare CDN (IPv4 / IPv6), Cloudflare Tunnel, localhost i sieci prywatne
    # https://www.cloudflare.com/ips-v4/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # https://www.cloudflare.com/ips-v6/
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Localhost i tunele prywatne
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $deployra_xfp {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    proxy_cache_path /var/cache/nginx/deployra levels=1:2 keys_zone=deployra_cache:10m max_size=256m inactive=60m use_temp_path=off;

    include /etc/nginx/deployra/http/*.conf;
}

stream {
    include /etc/nginx/deployra/stream/*.conf;
}
