{% from "_macros.html" import copy_pill %}
<div class="stack" style="gap: 10px; margin-top: 6px">
  <div class="small">{{ t("account.setup_hint") }}</div>
  <div class="field"><label>{{ t("access.totp_secret") }}</label>{{ copy_pill(secret) }}</div>
  <div class="field"><label>otpauth://</label>{{ copy_pill(uri) }}</div>
  <form class="row" style="gap: 8px" hx-post="/account/2fa/enable" hx-target="#twofa-out" hx-swap="innerHTML">
    <input class="input mono" name="code" style="max-width: 160px" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required autofocus>
    <button class="btn primary"><i class="bi bi-check2"></i> {{ t("account.confirm_code") }}</button>
  </form>
</div>
