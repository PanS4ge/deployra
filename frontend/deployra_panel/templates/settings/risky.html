{% extends "base.html" %}
{% block content %}
{% include "settings/_tabs.html" %}
<div class="card" style="border-color: rgba(251, 113, 133, 0.4)">
  <div class="card-head"><h3><i class="bi bi-radioactive"></i> {{ t("settings.reset_title") }}</h3></div>
  <div class="card-body row between">
    <div class="small dim" style="max-width: 680px">{{ t("settings.reset_hint") }}</div>
    <button class="btn danger" hx-post="/settings/risky/reset" hx-swap="none" hx-confirm="{{ t('settings.reset_confirm') }}" data-danger data-math><i class="bi bi-trash3"></i> {{ t("settings.reset") }}</button>
  </div>
</div>
{% endblock %}
