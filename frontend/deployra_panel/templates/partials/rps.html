{% if walkover %}
<span class="badge err">{{ t("rps.walkover") }}</span>
{% else %}
<div class="row fade-in">
  <span style="font-size: 1.6rem">{{ you }}</span><span class="muted">vs.</span><span style="font-size: 1.6rem">{{ node }}</span>
  {% if result == "win" %}<span class="badge ok">{{ t("rps.win") }}</span>{% elif result == "lose" %}<span class="badge err">{{ t("rps.lose") }}</span>{% else %}<span class="badge warn">{{ t("rps.draw") }}</span>{% endif %}
  <span class="pill">{{ ms }} ms</span>
</div>
{% endif %}
