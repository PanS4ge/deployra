{% extends "base.html" %}
{% block crumbs %}<div class="crumbs"><a href="/jobs">Zadania</a> /</div>{% endblock %}
{% block content %}
<div class="card" hx-ext="sse" sse-connect="/jobs/{{ job.id }}/stream" sse-close="end">
  <div class="card-head">
    <h3><i class="bi bi-activity"></i> {{ job.title }}</h3>
    <span class="spacer"></span>
    <span class="small muted">rozpoczęte {{ job.created | ago }}</span>
    <span sse-swap="end" hx-swap="innerHTML">
      {% if job.done %}{% if job.status == "ok" %}<span class="badge ok">zakończone</span>{% else %}<span class="badge err">błąd</span>{% endif %}{% else %}<span class="badge info"><span class="spin" style="width: 10px; height: 10px"></span> trwa</span>{% endif %}
    </span>
  </div>
  <div class="card-body">
    <pre class="log" sse-swap="line" hx-swap="beforeend"></pre>
  </div>
</div>
<div class="row"><a class="btn ghost" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Wróć</a></div>
{% endblock %}
