{% extends "base.html" %}
{% block crumbs %}<div class="crumbs"><a href="/nodes/{{ node.id }}">{{ node.name }}</a> / <a href="/nodes/{{ node.id }}/stacks{{ epq }}">stacki</a> /</div>{% endblock %}
{% block content %}
<form class="stack" hx-post="/nodes/{{ node.id }}/stacks/save{{ epq }}" hx-swap="none">
  <div class="card">
    <div class="card-body form-grid">
      <div class="field">
        <label>Nazwa stacka (projekt compose)</label>
        <input class="input mono" name="name" value="{{ stack.name }}" {% if not new %}readonly{% endif %} required pattern="[a-z0-9][a-z0-9_-]*" placeholder="moj-stack">
      </div>
      <div class="field" style="justify-content: flex-end">
        <label class="check"><input type="checkbox" name="pull" value="1"><span class="sw"></span><span>Pobierz najnowsze obrazy przed startem</span></label>
      </div>
    </div>
  </div>
  <div class="grid" style="grid-template-columns: minmax(0, 2fr) minmax(0, 1fr)">
    <div class="card">
      <div class="card-head"><h3><i class="bi bi-filetype-yml"></i> docker-compose.yml</h3></div>
      <div class="card-body"><textarea class="textarea tall" name="compose" spellcheck="false" required>{{ stack.compose }}</textarea></div>
    </div>
    <div class="card">
      <div class="card-head"><h3><i class="bi bi-key"></i> .env</h3></div>
      <div class="card-body stack">
        <textarea class="textarea tall" name="env" spellcheck="false" placeholder="POSTGRES_PASSWORD=...">{% for k, v in stack.env.items() %}{{ k }}={{ v }}
{% endfor %}</textarea>
        <div class="hint small muted">Dostępne w compose jako <code>${ZMIENNA}</code>. Plik ma uprawnienia 600.</div>
      </div>
    </div>
  </div>
  <div class="row" style="justify-content: flex-end">
    <a class="btn ghost" href="/nodes/{{ node.id }}/stacks{{ epq }}">Anuluj</a>
    <button class="btn primary"><span class="spin"></span><i class="bi bi-rocket-takeoff"></i> Zapisz i wdroż</button>
  </div>
</form>
{% endblock %}
