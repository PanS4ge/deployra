# ─── Deployra-WG (bramka) ─────────────────────────────────────────────────────────────────────
# Hub WireGuard + nginx dla ruchu publicznego. Stawiasz go na VPS z publicznym IP — tylko bramkę,
# gdy panel stoi gdzie indziej (panel razem z bramką → deploy/vps.compose.yml).
#
#   DEPLOYRA_PUBLIC_HOST=vps.example.com docker compose -f deploy/gateway.compose.yml up -d
#   docker logs deployra-wg   # kod synchronizacji dla panelu
#
# Porty na firewallu VPS: 80/tcp, 443/tcp, 51820/udp (WireGuard), 51821/tcp (bootstrap — tylko na czas
# synchronizacji panelu i dołączania węzłów) + porty streamów, jeśli ich używasz.
#
# Obrazy: domyślnie gotowe z GHCR (ghcr.io/pans4ge/deployra-*), aktualizacja = docker compose pull.
# Ze źródeł: DEPLOYRA_IMAGES=deployra w deploy/.env + `up -d --build` (aktualizacja = git + build).
name: deployra-wg

services:
  deployra-wg:
    build: { context: .., dockerfile: gateway/Dockerfile }
    image: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}-wg:${DEPLOYRA_VERSION:-latest}
    container_name: deployra-wg
    network_mode: host          # wg0 w przestrzeni sieciowej hosta: nginx widzi węzły pod 10.66.0.x
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]     # fallback wireguard-go, gdy kernel nie ma WireGuarda (OpenVZ/LXC)
    environment:
      DEPLOYRA_PUBLIC_HOST: ${DEPLOYRA_PUBLIC_HOST:?ustaw DEPLOYRA_PUBLIC_HOST — publiczny adres/IP tego VPS}
      DEPLOYRA_WG_SUBNET: ${DEPLOYRA_WG_SUBNET:-10.66.0.0/24}
    volumes:
      - wg-data:/var/lib/deployra-wg
      - nginx-conf:/etc/nginx/deployra   # bramka kopiuje tu też nginx.conf i skrypt przeładowania (base/)
      - certs:/etc/deployra/certs
      - acme:/var/www/acme
      - wg-updates:/run/deployra-update
    restart: unless-stopped
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }

  nginx:
    image: nginx:stable-alpine     # oficjalny obraz bez zmian; konfigurację dostarcza bramka przez wolumen
    container_name: deployra-nginx
    network_mode: host
    depends_on: [deployra-wg]
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -f /etc/nginx/deployra/base/nginx.conf ]; do echo "czekam na konfigurację od deployra-wg…"; sleep 2; done
        ln -sf /etc/nginx/deployra/base/nginx.conf /etc/nginx/nginx.conf
        sh /etc/nginx/deployra/base/deployra-reloader.sh
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - nginx-conf:/etc/nginx/deployra
      - certs:/etc/deployra/certs:ro
      - acme:/var/www/acme:ro
    restart: unless-stopped
    mem_limit: 96m
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }

  # Aktualizator: na prośbę bramki (z panelu) pobiera/buduje nową wersję i podmienia kontenery.
  # W spoczynku śpi (~1 MB RAM), nie ma sieci; docker.sock ma tylko on, nie bramka.
  wg-updater:
    build: ../updater
    image: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}-updater:${DEPLOYRA_VERSION:-latest}
    container_name: deployra-wg-updater
    network_mode: none
    environment:
      DEPLOYRA_UPDATE_SERVICES: deployra-wg nginx wg-updater
      DEPLOYRA_IMAGES: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wg-updates:/run/deployra-update
    restart: unless-stopped
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: 1m, max-file: "2" } }

volumes:
  wg-data:
  nginx-conf:
  certs:
  acme:
  wg-updates:
