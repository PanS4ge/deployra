events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dynamic port bounce:
    # Matches patterns like:
    # - npmpassthrough<id>.<port> (e.g. npmpassthrough379.8080)
    # - <port>.domain (e.g. 8080.frog01.pansage.xyz)
    # - p<port>.domain (e.g. p8080.frog01.pansage.xyz)
    map $http_host $bounce_port {
        default "";
        "~*^npmpassthrough[0-9]+\.(?<p1>[0-9]{2,5})$" $p1;
        "~*^(?:p|port-)?(?<p2>[0-9]{2,5})\." $p2;
    }

    # Named domain mappings:
    map $http_host $domain_upstream {
        hostnames;
        default "";
        # Example mappings:
        # frog01.pansage.xyz        127.0.0.1:20379;
        # ittools.pansage.xyz       127.0.0.1:8080;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Optional: listen on custom forwarded ports
        # listen 40379 default_server;
        # listen [::]:40379 default_server;

        server_name _;
        client_max_body_size 512M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location / {
            # 1. Custom domain match
            if ($domain_upstream != "") {
                proxy_pass http://$domain_upstream;
                break;
            }

            # 2. Dynamic port bounce match
            if ($bounce_port != "") {
                proxy_pass http://127.0.0.1:$bounce_port;
                break;
            }

            # 3. Deployra HMAC signed request fallback (to local Deployra backend)
            if ($http_x_deployra_signature != "") {
                proxy_pass http://127.0.0.1:20379;
                break;
            }

            # 4. Default: fallback to local Deployra backend
            proxy_pass http://127.0.0.1:20379;
        }
    }
}
