# Deployra Relay — mały nginx dla maszyn bez publicznego IPv4 (np. mikr.us za Cloudflare, tylko IPv6).
# Ruch idzie WYŁĄCZNIE do usług wpisanych niżej. Nieznany Host dostaje 444 (zamknięte połączenie) —
# relay nie może wystawiać przypadkowych portów localhost (Docker API, agent, bazy) do internetu.

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. Domena → usługa na tej maszynie. Wpisz swoje domeny (jedna linia na domenę).
    map $host $relay_upstream {
        hostnames;
        default "";
        # node.example.com      127.0.0.1:2750;    # agent Deployry (adres węzła w panelu: https://node.example.com)
        # tools.example.com     127.0.0.1:8080;
    }

    # 2. Zgodność ze starym schematem „npmpassthrough<id>.<port>.<twoja-domena>” — tylko porty z listy.
    map $host $relay_legacy_port {
        default "";
        # "~^npmpassthrough[0-9]+\.(?<p>[0-9]{4,5})\.example\.com$" $p;
    }
    map $relay_legacy_port $relay_legacy_allowed {
        default 0;
        # 8080 1;
    }

    # Prawdziwe IP odwiedzających zza Cloudflare (statystyki i bany w Deployrze).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Cloudflare łączy się po HTTP, ale odwiedzający jest na HTTPS — przekazujemy to dalej.
    map $http_x_forwarded_proto $relay_proto {
        default $scheme;
        https   https;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        # Dodatkowy port przydzielony przez dostawcę (np. mikr.us):
        # listen 40379;
        # listen [::]:40379;
        server_name _;
        client_max_body_size 512M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relay_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location / {
            if ($relay_upstream != "") {
                proxy_pass http://$relay_upstream;
                break;
            }
            if ($relay_legacy_allowed = 1) {
                proxy_pass http://127.0.0.1:$relay_legacy_port;
                break;
            }
            return 444;
        }
    }
}
