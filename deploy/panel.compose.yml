# ─── Deployra (panel) ─────────────────────────────────────────────────────────────────────────
# Sam panel — gdy stoi osobno (np. w domu albo na innym serwerze); po synchronizacji jest peerem tunelu
# Deployra-WG. Panel razem z bramką na jednym VPS → deploy/vps.compose.yml.
#
#   docker compose -f deploy/panel.compose.yml up -d
#
# Panel słucha domyślnie na 127.0.0.1:8080 — na świat wystawiasz go hostem proxy w samej Deployrze
# (np. deploy.example.com → 127.0.0.1:8080) albo przez tunel SSH.
name: deployra-panel

services:
  deployra:
    build: { context: .., dockerfile: frontend/Dockerfile }
    image: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}-panel:${DEPLOYRA_VERSION:-latest}
    container_name: deployra-panel
    network_mode: host          # potrzebne, żeby panel sam postawił wg0 i widział węzły w tunelu
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      DEPLOYRA_BIND: ${DEPLOYRA_BIND:-127.0.0.1}
      DEPLOYRA_PORT: ${DEPLOYRA_PORT:-8080}
      DEPLOYRA_SECURE_COOKIES: ${DEPLOYRA_SECURE_COOKIES:-false}   # true, gdy panel jest tylko za HTTPS
      DEPLOYRA_UPDATE_REPO: ${DEPLOYRA_UPDATE_REPO:-PanS4ge/deployra}   # skąd sprawdzać wydania (owner/repo na GitHubie)
      # DEPLOYRA_DB: mysql://deployra:haslo@127.0.0.1:3306/deployra   # domyślnie SQLite w wolumenie
    volumes:
      - panel-data:/var/lib/deployra-panel
      - panel-updates:/run/deployra-update
    restart: unless-stopped
    mem_limit: 160m
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }

  # Aktualizator panelu (zob. opis w gateway.compose.yml).
  panel-updater:
    build: ../updater
    image: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}-updater:${DEPLOYRA_VERSION:-latest}
    container_name: deployra-panel-updater
    network_mode: none
    environment:
      DEPLOYRA_UPDATE_SERVICES: deployra panel-updater
      DEPLOYRA_IMAGES: ${DEPLOYRA_IMAGES:-ghcr.io/pans4ge/deployra}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - panel-updates:/run/deployra-update
    restart: unless-stopped
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: 1m, max-file: "2" } }

volumes:
  panel-data:
  panel-updates:
