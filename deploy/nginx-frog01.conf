events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dynamic port bounce:
    # npmpassthrough379.8080 -> 8080
    # 8080.frog01.pansage.xyz -> 8080
    # p8080.frog01.pansage.xyz -> 8080
    map $http_host $bounce_port {
        default "";
        "~*^npmpassthrough[0-9]+\.(?<p1>[0-9]{2,5})$" $p1;
        "~*^(?:p|port-)?(?<p2>[0-9]{2,5})\." $p2;
    }

    # Named domain mapping:
    map $http_host $domain_upstream {
        hostnames;
        default "";
        frog01.pansage.xyz        127.0.0.1:20379;
        ittools.pansage.xyz       127.0.0.1:8080;
        e8400.pansage.xyz         127.0.0.1:8081;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 40379 default_server;
        listen [::]:40379 default_server;

        server_name _;
        client_max_body_size 512M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location / {
            if ($domain_upstream != "") {
                proxy_pass http://$domain_upstream;
                break;
            }

            if ($bounce_port != "") {
                proxy_pass http://127.0.0.1:$bounce_port;
                break;
            }

            if ($http_x_deployra_signature != "") {
                proxy_pass http://127.0.0.1:20379;
                break;
            }

            proxy_pass http://127.0.0.1:20379;
        }
    }
}
